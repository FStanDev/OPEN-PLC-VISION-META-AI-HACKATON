task_id: task_green_red_on
description: When start is pressed, latch the green lamp on. Stop turns everything
  off leaving red lamp on for 3 seconds.
signals:
- start_btn
- stop_btn
- lamp_red
- lamp_green
- arm_angle
tests:
- name: start_latches_green
  stimulus:
  - at_ms: 0
    press: start_btn
    release: null
  - at_ms: 200
    press: null
    release: start_btn
  expect:
  - signal: lamp_green
    value: true
    within_ms: 500
    at_ms: null
    tolerance: null
    tolerance_ms: null
  - signal: arm_angle
    value: 180
    within_ms: 1500
    at_ms: null
    tolerance: 10.0
    tolerance_ms: null
- name: stop_shows_red_then_safe
  stimulus:
  - at_ms: 0
    press: start_btn
    release: null
  - at_ms: 200
    press: null
    release: start_btn
  - at_ms: 1000
    press: stop_btn
    release: null
  - at_ms: 1200
    press: null
    release: stop_btn
  expect:
  - signal: lamp_green
    value: false
    within_ms: 1500
    at_ms: null
    tolerance: null
    tolerance_ms: null
  - signal: lamp_red
    value: true
    within_ms: 1700
    at_ms: null
    tolerance: null
    tolerance_ms: null
  - signal: lamp_red
    value: false
    within_ms: null
    at_ms: 5000
    tolerance: null
    tolerance_ms: null
