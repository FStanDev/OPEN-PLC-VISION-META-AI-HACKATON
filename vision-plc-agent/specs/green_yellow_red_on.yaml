task_id: green_yellow_red_on
description: When start is pressed, latch the green lamp on. Stop turns everything
  off leaving yellow lamp on for 3 seconds, then red lamp on for 1 second.
signals:
- start_btn
- stop_btn
- lamp_red
- lamp_green
- lamp_yellow
tests:
- name: start_latches_green
  stimulus:
  - at_ms: 0
    press: start_btn
    release: null
  - at_ms: 200
    press: null
    release: start_btn
  expect:
  - signal: lamp_green
    value: true
    within_ms: 1000
    at_ms: null
    tolerance: null
    tolerance_ms: null
  - signal: lamp_red
    value: false
    within_ms: 1100
    at_ms: null
    tolerance: null
    tolerance_ms: null
  - signal: lamp_yellow
    value: false
    within_ms: 1200
    at_ms: null
    tolerance: null
    tolerance_ms: null
- name: stop_yellow_then_red
  stimulus:
  - at_ms: 0
    press: start_btn
    release: null
  - at_ms: 200
    press: null
    release: start_btn
  - at_ms: 1000
    press: stop_btn
    release: null
  - at_ms: 1200
    press: null
    release: stop_btn
  expect:
  - signal: lamp_green
    value: false
    within_ms: 1700
    at_ms: null
    tolerance: null
    tolerance_ms: null
  - signal: lamp_yellow
    value: true
    within_ms: null
    at_ms: 2700
    tolerance: null
    tolerance_ms: null
  - signal: lamp_red
    value: true
    within_ms: null
    at_ms: 4700
    tolerance: null
    tolerance_ms: null
  - signal: lamp_yellow
    value: false
    within_ms: null
    at_ms: 4800
    tolerance: null
    tolerance_ms: null
  - signal: lamp_red
    value: false
    within_ms: null
    at_ms: 6000
    tolerance: null
    tolerance_ms: null
