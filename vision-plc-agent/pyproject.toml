[project]
name = "vision-plc-agent"
version = "0.1.0"
description = "AI agent that commissions a PLC like an engineer: writes ST, deploys to OpenPLC, verifies with vision."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<6",
    "pydantic>=2.0",
    "pymodbus>=3.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "pi"]
